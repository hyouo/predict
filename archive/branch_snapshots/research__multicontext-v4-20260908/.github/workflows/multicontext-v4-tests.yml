name: Multi-context v4 checks
on:
  push:
    branches: [research/multicontext-v4-20260908]
    paths: ['studies/multicontext_v4/**', '.github/workflows/multicontext-v4-tests.yml']
  pull_request:
    paths: ['studies/multicontext_v4/**', '.github/workflows/multicontext-v4-tests.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'
      - run: python -m pip install -r studies/multicontext_v4/requirements.txt
      - name: Mathematical and data-access checks, not biological validation
        working-directory: studies/multicontext_v4
        run: python -m unittest discover -s tests -v
