name: Orthogonal v11 public assay acquisition
on:
  push:
    branches: [research/orthogonal-v11-20260911]
    paths: [.github/workflows/orthogonal-v11-acquire.yml]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Retrieve public portal pages and linked processed time-series files
        run: |
          mkdir -p acquired
          python3 - <<'PY'
          import urllib.request, urllib.parse, hashlib, json, pathlib, datetime
          from html.parser import HTMLParser
          root=pathlib.Path('acquired'); records=[]; inventory=[]
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a':
                      href=dict(attrs).get('href')
                      if href:self.links.append(href)
          def get(url,name,cap=15000000):
              rec={'url':url,'file':name,'retrieved_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Public research data provenance audit'})
                  with urllib.request.urlopen(req,timeout=35) as r:
                      data=r.read(cap+1); rec['final_url']=r.url
                  if len(data)>cap:raise ValueError('per-file public-data cap exceeded')
                  (root/name).write_bytes(data)
                  rec.update(status='success',bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
              except Exception as e:
                  data=b'';rec.update(status='failed',error=str(e))
              records.append(rec);print(json.dumps(rec),flush=True)
              (root/'acquisition.json').write_text(json.dumps(records,indent=2))
              return data
          pages={
              'p100_portal.html':'https://panoramaweb.org/project/LINCS/P100/begin.view',
              'gcp_portal.html':'https://panoramaweb.org/project/LINCS/GCP/begin.view',
              'data_levels.html':'https://panoramaweb.org/labkey/wiki/LINCS/page.view?name=LINCS_PCCSE_Data_Levels'
          }
          for name,url in pages.items():
              data=get(url,name); p=Links();p.feed(data.decode('utf8',errors='replace'))
              links=sorted(set(urllib.parse.urljoin(url,u) for u in p.links))
              for u in links:
                  if urllib.parse.urlparse(u).hostname=='panoramaweb.org' and '.gct' in u.lower():
                      inventory.append({'portal':name,'url':u})
          (root/'gct_inventory.json').write_text(json.dumps(inventory,indent=2))
          chosen=[]
          for rec in inventory:
              u=rec['url'];name=urllib.parse.unquote(urllib.parse.urlparse(u).path.rsplit('/',1)[-1])
              selected=(('P100_PRM_Plate29_03H_' in name or 'P100_PRM_Plate29_06H_' in name or 'P100_PRM_Plate29_24H_' in name or 'GCP_Plate29_' in name) and ('LVL2.gct' in name or 'LVL3.gct' in name))
              if selected and u not in chosen:chosen.append(u)
          if len(chosen)>16:raise ValueError('Unexpected number of time-series matches; inspect inventory first')
          for u in chosen:
              name=urllib.parse.unquote(urllib.parse.urlparse(u).path.rsplit('/',1)[-1]);data=get(u,name)
              if data and not data.startswith(b'#1.'):
                  print('WARNING_NOT_GCT',name,flush=True)
          (root/'selection.json').write_text(json.dumps({'rule':'exact linked Plate29 PRM 03H/06H/24H and GCP Plate29 Level2/3','chosen':chosen,'no_training_performed':True},indent=2))
          PY
      - name: Preserve public files and acquisition evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orthogonal-v11-assays-${{ github.run_id }}
          path: acquired/
          retention-days: 14
          if-no-files-found: error
