name: Public Reactome prior v6
on:
  push:
    branches: [research/pathway-support-v6-20260908]
    paths: [.github/workflows/pathway-v6-assets.yml]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Download public gene sets only, with size and integrity audit
        run: |
          mkdir -p prior
          python3 - <<'PY'
          import urllib.request, pathlib, hashlib, json, zipfile, io, datetime
          out=pathlib.Path('prior'); attempts=[]; success=False
          urls=['https://download.reactome.org/current/ReactomePathways.gmt.zip','https://reactome.org/download/current/ReactomePathways.gmt.zip']
          for url in urls:
              rec={'url':url,'time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'public-research-data-audit/1.0'})
                  with urllib.request.urlopen(req,timeout=40) as r:
                      raw=r.read(8*1024*1024+1); rec['headers']=dict(r.headers);rec['resolved_url']=r.geturl()
                  if len(raw)>8*1024*1024: raise ValueError('8 MiB size cap exceeded')
                  with zipfile.ZipFile(io.BytesIO(raw)) as z:
                      if sum(v.file_size for v in z.infolist())>40*1024*1024: raise ValueError('Expanded size cap exceeded')
                      names=[n for n in z.namelist() if n.endswith('.gmt')]
                      if len(names)!=1: raise ValueError('Expected one GMT file')
                      text=z.read(names[0]).decode('utf8')
                      if not text.strip() or '\t' not in text:raise ValueError('Invalid GMT')
                      (out/'ReactomePathways.gmt').write_text(text)
                  (out/'ReactomePathways.gmt.zip').write_bytes(raw)
                  rec.update(status='success',bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),gmt_sha256=hashlib.sha256(text.encode()).hexdigest(),gmt_lines=len(text.splitlines()))
                  success=True
              except Exception as e:rec.update(status='failed',error=repr(e))
              attempts.append(rec)
              if success:break
          (out/'acquisition.json').write_text(json.dumps({'attempts':attempts,'success':success,'training_performed':False,'source':'Reactome Pathway Database, preserve attribution','purpose':'external pathway-membership prior, not target outcomes'},indent=2))
          print(json.dumps(attempts),flush=True)
          if not success:raise SystemExit(1)
          PY
      - name: Archive public data and failed-attempt audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reactome-v6-${{ github.run_id }}
          path: prior/
          retention-days: 14
          if-no-files-found: error
