name: Frozen quantitative RNA regression
# Successful full replay: run 34019933564. Explicit manual replay only.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rna-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Acquire fixed public data with checksums and byte caps
        run: |
          python -m tools.assets --asset auxiliary
          python -m tools.assets --asset op3
          python -m tools.assets --asset sciplex
          python -m tools.upstream_metadata
          python -m tools.op3_measurement_audit --output runs/ci-op3-reconciliation.json
      - name: All mathematical and real-input access tests
        run: python -m unittest discover -s tests -v
      - name: Replay frozen OP3 fit and private evaluation
        run: |
          python -m tools.rna_experiment fit --output runs/ci-op3
          python -m tools.rna_experiment evaluate --output runs/ci-op3 --split private_test
      - name: Replay frozen external protocol with all folds sealed first
        run: |
          for ct in CVCL_0004 CVCL_0023 CVCL_0031; do
            python -m tools.sciplex_experiment fit --output runs/ci-sciplex --target "$ct"
          done
          python -m tools.sciplex_experiment evaluate --output runs/ci-sciplex
      - name: Compare to previously frozen numerical results
        run: python -m tools.rna_regression_summary
      - name: Save compact records (no repeated raw data or large prediction banks)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rna-regression-${{ github.run_id }}
          path: |
            runs/ci-rna-summary/
            runs/ci-op3-reconciliation.json
            runs/ci-op3/prediction_lock.json
            runs/ci-op3/fit_access.json
            runs/ci-sciplex/*/prediction_lock.json
            runs/ci-sciplex/failure_*.json
          retention-days: 7
          if-no-files-found: error
