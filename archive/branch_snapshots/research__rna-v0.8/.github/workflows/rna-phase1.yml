name: RNA phase 1 acquisition
# Acquisition completed in run 34016412453. Manual archival replay only.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rna-phase1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Fetch fixed sci-Plex input (160 MiB cap)
        run: python -m tools.assets --asset sciplex
      - name: Audit fixed upstream OP3 (512 MiB cap)
        run: python -m tools.upstream_metadata
      - name: Preserve public inputs and audit records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rna-phase1-${{ github.run_id }}
          path: |
            data/rna/srivatsan20_sciplex3_processed.h5ad
            data/rna/srivatsan20_sciplex3_processed.audit.json
            runs/op3-upstream-audit/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
