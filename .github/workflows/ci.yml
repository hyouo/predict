name: Research CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Acquire and verify the public auxiliary panel
        run: python -m tools.assets --asset auxiliary
      - name: Run unit and mathematical checks
        run: python -m unittest discover -s tests -v
      - name: Measured-data integration check (not biological validation)
        run: python -m tools.smoke --output runs/ci-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-record-${{ github.run_id }}
          path: |
            runs/ci-smoke/
            data/hepatocyte_signaling_raw.audit.json
          if-no-files-found: warn
          retention-days: 7
