name: Count operator public metadata inventory
on:
  push:
    branches: [research/count-operator-20260907]
    paths: [.github/workflows/count-source-inventory.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect fixed public dataset metadata only
        shell: bash
        run: |
          mkdir -p inventory
          python3 - <<'PY'
          import urllib.request,json,pathlib,hashlib,datetime
          revision='6c54c8eb0321cceff4f888c54e199077d055e20b'
          records=[]
          for dataset in ['tahoe','l1000_phase1','vcpi_0001']:
              url=f'https://huggingface.co/api/datasets/theislab/chem-perturbridge/tree/{revision}/{dataset}?recursive=false&limit=1000'
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'hyouo-predict-research-inventory'})
                  with urllib.request.urlopen(req,timeout=30) as response:
                      raw=response.read(2*1024*1024+1)
                  if len(raw)>2*1024*1024: raise RuntimeError('metadata size cap')
                  data=json.loads(raw)
                  pathlib.Path('inventory',dataset+'.json').write_bytes(raw)
                  records.append({'dataset':dataset,'revision':revision,'url':url,'sha256':hashlib.sha256(raw).hexdigest(),'files':[x for x in data if x.get('type')=='file']})
              except Exception as exc:
                  records.append({'dataset':dataset,'url':url,'error':repr(exc)})
          result={'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat(),'metadata_only':True,'expression_matrices_downloaded':False,'records':records}
          pathlib.Path('inventory/summary.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: count-source-inventory-${{ github.run_id }}
          path: inventory/
          retention-days: 14
          if-no-files-found: error
