name: Usable release acceptance
on:
  pull_request:
    paths: ['perturb_predict/**', 'tests_release/**', 'pyproject.toml', 'requirements-release.txt', 'docs/releases/**', '.github/workflows/usable-release.yml']
  push:
    branches: [main]
    paths: ['perturb_predict/**', 'tests_release/**', 'pyproject.toml', 'requirements-release.txt', 'docs/releases/**', '.github/workflows/usable-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: usable-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installed-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: requirements-release.txt
      - name: Install pinned numerical dependencies and build wheel
        run: |
          python -m pip install -r requirements-release.txt
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Test installed package away from repository root
        run: |
          cd "$RUNNER_TEMP"
          perturb-predict --version
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests_release" -p 'test_*.py' -v
      - name: Get one fixed public OP3 asset
        run: perturb-predict fetch-op3 --out data/rna/op3_standardized_processed.h5ad
      - name: Real OP3 replay and standalone inference acceptance
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests_release/acceptance.py" --data "$GITHUB_WORKSPACE/data/rna/op3_standardized_processed.h5ad" --out "$GITHUB_WORKSPACE/runs/release-acceptance"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: usable-v0.1.0-${{ github.run_id }}
          path: |
            dist/*.whl
            runs/release-acceptance/
          retention-days: 7
          if-no-files-found: warn
