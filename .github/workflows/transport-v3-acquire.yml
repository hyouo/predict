name: Transport v3 Tahoe acquisition
on:
  push:
    branches: [research/transport-v3-20260908]
    paths: [.github/workflows/transport-v3-acquire.yml, studies/context_v3/acquire.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 h5py==3.15.1
      - name: Download fixed public 4.47 GB input and export control-selected panel
        run: python studies/context_v3/acquire.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: transport-v3-panel-${{ github.run_id }}
          path: acquired_v3/
          retention-days: 7
          compression-level: 1
          if-no-files-found: error
