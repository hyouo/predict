name: Pinned OP3 acquisition audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - assets/manifest.json
      - tools/assets.py
      - .github/workflows/rna-audit.yml
permissions:
  contents: read
concurrency:
  group: op3-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acquire:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Acquire one fixed public OP3 file, capped at 32 MiB
        run: python -m tools.assets --asset op3
      - name: Preserve public data and structure audit outside Git
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: op3-pinned-${{ github.run_id }}
          path: |
            data/rna/op3_standardized_processed.h5ad
            data/rna/op3_standardized_processed.audit.json
            assets/manifest.json
            data/ATTRIBUTION.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
