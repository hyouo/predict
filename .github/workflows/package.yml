name: Package CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installed-package:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build wheel from source distribution and check metadata
        run: |
          python -m pip install "build>=1.2,<2" "twine>=6,<7"
          python -m build
          python -m twine check --strict dist/*
      - name: Install wheel and verify away from the checkout
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root = pathlib.Path.cwd()
          wheel, = root.glob('dist/*.whl')
          subprocess.run([sys.executable, '-m', 'pip', 'install', str(wheel)], check=True)
          subprocess.run([sys.executable, '-m', 'pip', 'check'], check=True)
          os.chdir(os.environ['RUNNER_TEMP'])
          import perturb_predict
          assert not pathlib.Path(perturb_predict.__file__).is_relative_to(root)
          subprocess.run(['perturb-predict', '--version'], check=True)
          subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s',
                          str(root / 'tests_release'), '-p', 'test_*.py', '-v'], check=True)
          subprocess.run(['perturb-predict', 'demo', '--out', 'predict-offline-demo'], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: package-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            dist/*
            ${{ runner.temp }}/predict-offline-demo/
          retention-days: 7
          if-no-files-found: warn
