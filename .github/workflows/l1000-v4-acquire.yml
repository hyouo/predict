name: Bounded L1000 Phase II acquisition v4
on:
  push:
    branches: [research/multicontext-v4-20260908]
    paths: [.github/workflows/l1000-v4-acquire.yml]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install data readers only
        run: python3 -m pip install numpy==2.3.5 pandas==2.2.3 h5py==3.15.1 scipy==1.17.0
      - name: Download and export with contiguous CSR reads
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          mkdir -p audit exported
          python3 - <<'PY'
          import urllib.request, hashlib, json, pathlib, datetime
          import h5py, numpy as np, pandas as pd
          from scipy import sparse
          url='https://huggingface.co/datasets/theislab/chem-perturbridge/resolve/6c54c8eb0321cceff4f888c54e199077d055e20b/l1000_phase2/l1000_phase2_level3_deg_ready_landmark_processed.h5ad?download=true'
          expected='34d198df9eddac5b535a0408794caaf41073fa014c74429d1050e483576fb581'
          p=pathlib.Path('/tmp/l1000.h5ad'); h=hashlib.sha256(); n=0
          with urllib.request.urlopen(url,timeout=90) as src,p.open('wb') as dst:
              for block in iter(lambda:src.read(1024*1024),b''):
                  n+=len(block)
                  if n>800000000: raise ValueError('download cap exceeded')
                  h.update(block);dst.write(block)
          if h.hexdigest()!=expected or n!=707799618: raise ValueError('source checksum/size mismatch')
          print('DOWNLOADED',n,expected,flush=True)
          def text(v):return v.decode('utf8') if isinstance(v,bytes) else str(v)
          def column(node):
              if isinstance(node,h5py.Dataset):
                  a=node[()]
                  return np.asarray([text(v) for v in a]) if a.dtype.kind in 'SO' else a
              if 'categories' in node and 'codes' in node:
                  cats=column(node['categories']);codes=node['codes'][()]
                  return np.asarray([None if k<0 else cats[k] for k in codes],object)
              if 'values' in node and 'mask' in node:
                  a=column(node['values']).astype(object);a[node['mask'][()]]=None;return a
              raise ValueError('Unsupported column '+node.name)
          def frame(group):
              ix=text(group.attrs.get('_index','_index'))
              return pd.DataFrame({k:column(v) for k,v in group.items() if k!=ix},index=column(group[ix]))
          with h5py.File(p,'r') as f:
              obs=frame(f['obs']);var=frame(f['var']);obs.insert(0,'original_row',np.arange(len(obs)))
              obs.to_csv('audit/all_obs.csv.gz');var.to_csv('audit/var.csv.gz')
              x=f['X'];shape=tuple(x.shape) if isinstance(x,h5py.Dataset) else tuple(int(v) for v in x.attrs['shape'])
              rec={'url':url,'sha256':expected,'bytes':n,'shape':shape,'obs_columns':list(obs),'var_columns':list(var),'root_keys':list(f),'X_attrs':{k:str(v) for k,v in x.attrs.items()},'training_performed':False,'approved_for_training':False}
              for key in ['cell_type','pert_type','is_control','pert_time_h','pert_dose_uM']:
                  if key in obs:rec[key]={str(k):int(v) for k,v in obs[key].value_counts(dropna=False).head(100).items()}
              time=pd.to_numeric(obs['pert_time_h'],errors='coerce').to_numpy();dose=pd.to_numeric(obs['pert_dose_uM'],errors='coerce').to_numpy()
              control=obs['is_control'].astype(str).str.lower().isin(['true','1']).to_numpy()
              rows=np.flatnonzero(np.isclose(time,24)&(control|np.isclose(dose,10)))
              obs.iloc[rows].to_csv('audit/slice_obs.csv.gz');var.to_csv('audit/slice_var.csv.gz')
              rec.update(slice_rows=len(rows),slice_control_rows=int(control[rows].sum()),slice_criteria='24h; all controls or 10uM treatment; no outcome filtering')
              pathlib.Path('audit/acquisition.json').write_text(json.dumps(rec,indent=2,default=str))
              print('METADATA',json.dumps(rec,default=str),flush=True)
              if not len(rows) or len(rows)>144000:raise ValueError('slice outside explicit row budget')
              ip=x['indptr'][()] if isinstance(x,h5py.Group) else None;parts=[]
              for j,start in enumerate(range(0,len(rows),18000)):
                  sel=rows[start:start+18000];lo,hi=int(sel[0]),int(sel[-1])+1
                  if isinstance(x,h5py.Dataset):a=x[lo:hi,:][sel-lo]
                  elif str(x.attrs.get('encoding-type',''))=='csr_matrix':
                      left,right=int(ip[lo]),int(ip[hi]);dd=x['data'][left:right];ii=x['indices'][left:right]
                      a=sparse.csr_matrix((dd,ii,ip[lo:hi+1]-left),shape=(hi-lo,shape[1]))[sel-lo].toarray()
                  else:raise ValueError('unsupported X encoding')
                  name=f'exported/part_{j:03d}.npz';np.savez_compressed(name,X=a,original_rows=sel)
                  q=pathlib.Path(name);parts.append({'file':name,'shape':a.shape,'bytes':q.stat().st_size,'sha256':hashlib.sha256(q.read_bytes()).hexdigest()})
                  print('PART',json.dumps(parts[-1]),flush=True)
              rec['parts']=parts;rec['completed']=True
              pathlib.Path('audit/acquisition.json').write_text(json.dumps(rec,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: l1000-v4-audit-${{ github.run_id }}
          path: audit/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l1000-v4-part0-${{ github.run_id }}
          path: exported/part_000.npz
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l1000-v4-part1-${{ github.run_id }}
          path: exported/part_001.npz
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l1000-v4-part2-${{ github.run_id }}
          path: exported/part_002.npz
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l1000-v4-part3-${{ github.run_id }}
          path: exported/part_003.npz
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l1000-v4-part4-${{ github.run_id }}
          path: exported/part_004.npz
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l1000-v4-part5-${{ github.run_id }}
          path: exported/part_005.npz
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l1000-v4-part6-${{ github.run_id }}
          path: exported/part_006.npz
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l1000-v4-part7-${{ github.run_id }}
          path: exported/part_007.npz
          compression-level: 0
          retention-days: 14
